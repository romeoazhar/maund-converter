<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KG to Maund Converter</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#007bff">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 100px;
    }
    .box {
      background: white;
      padding: 20px 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      text-align: center;
    }
    input {
      padding: 8px;
      width: 150px;
      margin-top: 10px;
    }
    button {
      padding: 8px 15px;
      margin-top: 10px;
      cursor: pointer;
      border: none;
      background: #007bff;
      color: white;
      border-radius: 5px;
    }
  </style>
</head>
<body>

  <div class="box">
    <h2>KG to Maund Converter</h2>
    <input type="number" id="kg" placeholder="Enter kilograms">
    <br>
    <button onclick="convertToMaund()">Convert</button>
    <h3 id="result"></h3>
    <p style="margin-top:15px;font-size:12px;color:#888;">Made by Romeo Azhar</p>
  </div>

  <script>
    function convertToMaund() {
      const kg = Number(document.getElementById('kg').value);
      const MAUND_IN_KG = 40;
      const maund = Math.floor(kg / MAUND_IN_KG);
      const seer = kg % MAUND_IN_KG;
      document.getElementById('result').textContent =
        `${kg} kg = ${maund}.${seer < 10 ? '0' + seer : seer} maunds (Maund.Seer)`;
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>

</body>
</html>
